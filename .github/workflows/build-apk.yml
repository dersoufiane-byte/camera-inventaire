name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Projet trouvé dans : $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - name: Renommer
        run: cp "$(find . -name app-debug.apk | head -1)" InventaireCamera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InventaireCamera-apk
          path: InventaireCamera.apk
